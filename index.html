<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Top 10 AI Research Keywords</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>10 คำคีย์เวิร์ดวิจัย AI ที่ถูกใช้มากที่สุด (2025)</h2>
        <canvas id="keywordsChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('keywordsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Artificial Intelligence', 'Machine Learning', 'Deep Learning', 'Explainable AI', 'ChatGPT', 'Generative AI', 'Computer Vision', 'Reinforcement Learning', 'Educational Tech', 'LLMs'],
                datasets: [{
                    label: 'จำนวนงานวิจัย (Papers)',
                    data: [120, 49, 48, 16, 7, 7, 5, 4, 4, 4],
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { indexAxis: 'y', responsive: true }
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Top AI Publishing Sources</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>วารสารและงานประชุมที่ตีพิมพ์ผลงานสูงสุด</h2>
        <canvas id="sourcesChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('sourcesChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['ShodhKosh Journal', 'IJACSA', 'Engineering Research Express', 'ICMHI 2025', 'J. Medical AI', 'Ocean Engineering', 'Others'],
                datasets: [{
                    data: [29, 27, 20, 15, 14, 11, 184],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#C9CBCF']
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Open Access Status</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>สัดส่วนรูปแบบการเข้าถึงบทความ (Open Access Status)</h2>
        <canvas id="oaChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('oaChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Gold Open Access', 'Non-Open Access', 'Gold + Green Open Access', 'Hybrid Gold', 'Bronze / Green Open Access'],
                datasets: [{
                    data: [92, 88, 87, 19, 14],
                    backgroundColor: ['#2ecc71', '#e74c3c', '#3498db', '#f1c40f', '#9b59b6']
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
